# Rhadix Uitvraag — Staging docker-compose
# ─────────────────────────────────────────────────────────────────────────────
# VOLLEDIG GESCHEIDEN van productie én van de Rhadix-validation-app:
#   - Eigen container-namen   (kik-staging-*)
#   - Eigen poorten           (5177 / 8013)
#   - Eigen database          (kik_staging op volume kik_staging_pgdata)
#   - Eigen image-tag         (:staging)
#   - Eigen env-file          (.env.staging op de server)
#
# Gebruik op de server:
#   docker compose -p kik-staging -f docker-compose.staging.yml --env-file .env.staging up -d
# ─────────────────────────────────────────────────────────────────────────────

services:

  db:
    image: postgres:16-alpine
    container_name: kik-staging-db
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${STAGING_DB_USER:-kik_staging}
      POSTGRES_PASSWORD: ${STAGING_DB_PASSWORD:?Stel STAGING_DB_PASSWORD in in .env.staging}
      POSTGRES_DB:       ${STAGING_DB_NAME:-kik_staging}
    volumes:
      - pgdata_staging:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${STAGING_DB_USER:-kik_staging} -d ${STAGING_DB_NAME:-kik_staging}"]
      interval: 5s
      timeout: 5s
      retries: 5
    # Geen externe poort — alleen via intern Docker-netwerk

  fuseki:
    image: stain/jena-fuseki:5.1.0
    container_name: kik-staging-fuseki
    restart: unless-stopped
    environment:
      ADMIN_PASSWORD:   ${STAGING_FUSEKI_PASSWORD:-kik-staging-admin}
      FUSEKI_DATASET_1: kik
      JVM_ARGS:         -Xmx512m
    volumes:
      - fuseki_staging:/fuseki
    # Geen externe poort — alleen intern Docker-netwerk

  backend:
    image: ghcr.io/${GHCR_ORG:-rhadix2026}/uitvraag-backend:${STAGING_IMAGE_TAG:-staging}
    container_name: kik-staging-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      fuseki:
        condition: service_started
    environment:
      DATABASE_URL:       postgresql://${STAGING_DB_USER:-kik_staging}:${STAGING_DB_PASSWORD}@kik-staging-db:5432/${STAGING_DB_NAME:-kik_staging}
      JWT_SECRET_KEY:     ${STAGING_JWT_SECRET_KEY:?Stel STAGING_JWT_SECRET_KEY in als GitHub Secret}
      KIK_ENV:            staging
      # ── Centrale identiteit (SureSync ID) — accepteer centraal RS256-token.
      CENTRAL_JWT_PUBLIC_KEY: ${CENTRAL_JWT_PUBLIC_KEY:-}
      CENTRAL_JWT_ISSUER:     suresync-id
      SSO_COOKIE_NAME:        rhadix_sso_staging
      # KIK_ADMIN_EMAIL/KIK_ADMIN_PASSWORD zijn verwijderd: de bootstrap seedt geen
      # gebruikers meer en niets in de code leest deze variabelen nog. Gebruikers
      # ontstaan via SSO/JIT; machine-clients via client_credentials.
      # Lokale wachtwoord-login: standaard UIT, authenticatie verloopt via SSO
      # (Datavalidatie als identity provider). Expliciet doorgegeven zodat hij als
      # noodrem aan te zetten is zonder release: LOCAL_LOGIN_ENABLED=1 in .env.staging.
      # NB: raakt niet de OAuth2 password-grant in routers/external.py.
      LOCAL_LOGIN_ENABLED: ${LOCAL_LOGIN_ENABLED:-0}
      # Applicatietoegang via de centrale apps-claim (auth/app_access.py).
      # off = geen controle | warn = loggen wat geweigerd zou worden | on = 403.
      # Raakt niet de externe API: die autoriseert via de clientregistratie.
      APP_ACCESS_ENFORCE: ${APP_ACCESS_ENFORCE:-warn}
      # ── Externe API (KIK-Starter): machine-to-machine clients ──────────────
      # Registratie van externe afnemers (base64-JSON met bcrypt-hashes), per
      # omgeving uit een GitHub Environment secret. Leeg = de tokenroute weigert
      # dienst (fail-closed); de rest van de applicatie start gewoon.
      KSAPI_CLIENTS: ${KSAPI_CLIENTS:-}
      # Oude password-grant: standaard UIT, alleen bewust en tijdelijk aan te
      # zetten tijdens migratie van een externe afnemer.
      KSAPI_ALLOW_PASSWORD_GRANT: ${KSAPI_ALLOW_PASSWORD_GRANT:-0}
      # Clienttokens leven korter dan gebruikerstokens.
      KSAPI_TOKEN_EXPIRE_MINUTES: ${KSAPI_TOKEN_EXPIRE_MINUTES:-60}
      FUSEKI_URL:         http://kik-staging-fuseki:3030
      FUSEKI_DATASET:     kik
      FUSEKI_USER:        admin
      FUSEKI_PASSWORD:    ${STAGING_FUSEKI_PASSWORD:-kik-staging-admin}
      RHADIX_PROFILES_URL: ${STAGING_PROFILES_URL:-}
      VALIDATION_API_URL: ${VALIDATION_API_URL:-https://app.rhadix.nl}
    ports:
      - "${STAGING_BACKEND_PORT:-8013}:8000"

    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    image: ghcr.io/${GHCR_ORG:-rhadix2026}/uitvraag-frontend:${STAGING_IMAGE_TAG:-staging}
    container_name: kik-staging-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${STAGING_FRONTEND_PORT:-5177}:80"

volumes:
  pgdata_staging:
    name: kik_staging_pgdata
  fuseki_staging:
    name: kik_staging_fuseki
